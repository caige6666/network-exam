<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="网络工程师软考备考题库：历年真题与高仿真模拟题分库收录，支持模拟考试、错题本、学习分析，离线可用，跨端运行。">
<title>网工真题 · 网络工程师模拟考试系统</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Cpath d='M16 20h32v6H16zm0 12h20v6H16zm0 12h26v6H16z' fill='white'/%3E%3C/svg%3E">
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#eef2f9; --bg2:#ffffff; --bg3:#e4eaf5; --bg4:#f7f9fd;
  --text:#15233c; --text2:#57698a; --text3:#8b9ab5;
  --line:#d9e2f0; --line2:#c3d0e6;
  --brand:#2f6fed; --brand-d:#2357c9; --brand-l:#eaf1ff; --brand-t:#ffffff;
  --ok:#15803d; --ok-bg:#e8f7ee; --err:#d92d20; --err-bg:#fdecea;
  --warn:#b45309; --warn-bg:#fdf3e2; --info:#0369a1; --info-bg:#e8f4fb;
  --shadow:0 1px 2px rgba(18,36,72,.05), 0 8px 24px rgba(18,36,72,.07);
  --shadow-lg:0 2px 6px rgba(18,36,72,.08), 0 20px 48px rgba(18,36,72,.14);
  --radius:14px; --radius-s:9px;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"JetBrains Mono",monospace;
}
[data-theme="dark"]{
  --bg:#0c1322; --bg2:#111b30; --bg3:#17233d; --bg4:#0f1930;
  --text:#e6edf9; --text2:#9dafca; --text3:#66779a;
  --line:#20304e; --line2:#2b3f63;
  --brand:#4d8dff; --brand-d:#7aabff; --brand-l:#16294e; --brand-t:#ffffff;
  --ok:#3ecf6a; --ok-bg:#0f2a1e; --err:#ff6b5e; --err-bg:#2c1616;
  --warn:#ffb547; --warn-bg:#2c2013; --info:#56b6f5; --info-bg:#102331;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4), 0 20px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; transition:background .25s,color .25s;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--bg4);border:1px solid var(--line);border-radius:var(--radius-s);padding:8px 10px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
select{appearance:auto;cursor:pointer}
a{color:var(--brand);text-decoration:none}
::selection{background:var(--brand);color:#fff}

/* ============ 布局 ============ */
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.topbar{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:14px;height:58px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.brand svg{flex:none}
.brand small{font-weight:500;color:var(--text3);font-size:11px;display:block;line-height:1.1}
.nav{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;font-size:14px;color:var(--text2);white-space:nowrap;transition:background .15s,color .15s}
.nav button:hover{background:var(--bg3);color:var(--text)}
.nav button.on{background:var(--brand-l);color:var(--brand);font-weight:600}
.nav button svg{flex:none;opacity:.85}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);background:var(--bg4);border:1px solid var(--line);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--bg3);color:var(--text)}
main{padding:22px 0 60px;min-height:calc(100vh - 58px)}
.page{display:none;animation:fadein .22s ease}
.page.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 通用组件 ============ */
h1.page-title{font-size:22px;font-weight:700;letter-spacing:.3px}
h2.sec-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-sub{color:var(--text3);font-size:13px;font-weight:400}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;transition:filter .15s,background .15s,color .15s,transform .05s;user-select:none;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--brand);color:var(--brand-t);box-shadow:0 2px 8px color-mix(in srgb,var(--brand) 35%,transparent)}
.btn-pri:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--bg4);border:1px solid var(--line);color:var(--text2)}
.btn-ghost:hover{border-color:var(--line2);color:var(--text)}
.btn-danger{background:var(--err);color:#fff}
.btn-danger:hover{filter:brightness(1.1)}
.btn-block{width:100%}
.btn-lg{padding:12px 24px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.6}
.badge-real{background:var(--brand-l);color:var(--brand)}
.badge-mock{background:var(--warn-bg);color:var(--warn)}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-err{background:var(--err-bg);color:var(--err)}
.badge-gray{background:var(--bg3);color:var(--text3)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.kbd{font-family:var(--mono);font-size:11px;background:var(--bg3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--text2)}
.muted{color:var(--text3);font-size:13px}
.stat-num{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.3px;line-height:1.2}
.empty{text-align:center;padding:52px 20px;color:var(--text3)}
.empty svg{opacity:.4;margin-bottom:10px}
.empty p{font-size:14px;margin-top:6px}

/* ============ 首页 ============ */
.hero{display:grid;grid-template-columns:1.35fr .8fr;gap:18px;margin-bottom:18px}
.hero-main{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 92%,#0a2f6b),var(--brand-d));color:#fff;border:none;position:relative;overflow:hidden}
.hero-main::after{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%)}
.hero-main::before{content:"";position:absolute;right:70px;bottom:-110px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 60%)}
.hero-main h1{font-size:24px;font-weight:700;letter-spacing:.5px;position:relative;z-index:1}
.hero-main p{margin-top:8px;font-size:13.5px;opacity:.85;max-width:520px;position:relative;z-index:1}
.hero-actions{display:flex;gap:10px;margin-top:18px;position:relative;z-index:1;flex-wrap:wrap}
.btn-hero{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px)}
.btn-hero:hover{background:rgba(255,255,255,.26)}
.btn-hero-solid{background:#fff;color:var(--brand-d);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.btn-hero-solid:hover{background:#f0f6ff}
.hero-meta{display:flex;gap:20px;margin-top:20px;position:relative;z-index:1}
.hero-meta .hm b{font-family:var(--mono);font-size:20px;font-weight:700;display:block}
.hero-meta .hm span{font-size:12px;opacity:.75}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:5px}
.kpi .k-num{font-family:var(--mono);font-size:22px;font-weight:700;margin-top:2px}
.kpi .k-sub{font-size:11.5px;color:var(--text3);margin-top:1px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line)}
.list-row:last-child{border-bottom:none}
.list-row .lr-main{flex:1;min-width:0}
.list-row .lr-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .lr-sub{font-size:12px;color:var(--text3)}
.pill-score{font-family:var(--mono);font-weight:700;font-size:16px;min-width:52px;text-align:right}
.quick-tips{font-size:13px;color:var(--text2)}
.quick-tips li{margin:6px 0 6px 18px}
.quick-tips b{color:var(--text)}

/* ============ 组卷配置 ============ */
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--text3);margin-top:4px}
.seg{display:flex;background:var(--bg3);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text2);transition:background .15s,color .15s}
.seg button.on{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px rgba(18,36,72,.12)}
[data-theme="dark"] .seg button.on{box-shadow:0 1px 4px rgba(0,0,0,.4)}
.range-wrap{display:flex;align-items:center;gap:12px}
.range-wrap output{font-family:var(--mono);font-weight:700;font-size:17px;min-width:56px;text-align:right;color:var(--brand)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:4px;background:var(--bg3);outline:none;padding:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--brand);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--brand);border:3px solid #fff;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg4);font-size:13px;color:var(--text2);transition:all .15s;user-select:none}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--brand-l);border-color:var(--brand);color:var(--brand);font-weight:600}
.cfg-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;padding:14px 16px;background:var(--bg4);border:1px solid var(--line);border-radius:12px}
.cfg-summary .cs-num{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--brand)}
.cfg-summary .cs-tip{font-size:12.5px;color:var(--text3)}

/* ============ 考试 ============ */
.exam-head{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;box-shadow:var(--shadow);flex-wrap:wrap}
.exam-title{font-weight:700;font-size:15px}
.timer{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:1px;padding:4px 12px;border-radius:9px;background:var(--bg4);border:1px solid var(--line);color:var(--text)}
.timer.warn{color:var(--err);border-color:var(--err);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.progress{flex:1;min-width:120px;height:8px;background:var(--bg3);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:5px;transition:width .3s}
.exam-layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.q-card{padding:22px 22px 16px}
.q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;color:var(--text3)}
.q-meta .dot{width:4px;height:4px;border-radius:50%;background:var(--line2)}
.q-stem{font-size:15.5px;font-weight:600;line-height:1.75;margin-bottom:16px;white-space:pre-wrap}
.q-stem .idx{color:var(--brand);font-family:var(--mono);margin-right:4px}
.options{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;transition:all .13s;background:var(--bg4);user-select:none}
.opt:hover{border-color:var(--line2);background:var(--bg2)}
.opt .key{flex:none;width:24px;height:24px;border-radius:7px;background:var(--bg3);color:var(--text2);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.opt .txt{flex:1;font-size:14.5px;line-height:1.65;padding-top:1px}
.opt.sel{border-color:var(--brand);background:var(--brand-l)}
.opt.sel .key{background:var(--brand);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--err);background:var(--err-bg)}
.opt.wrong .key{background:var(--err);color:#fff}
.opt.reveal{opacity:.55}
.opt.reveal.keep{opacity:1}
.q-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.q-foot .btns{display:flex;gap:8px}
.flag-btn.on{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);position:sticky;top:72px}
.sheet h3{font-size:13px;color:var(--text2);font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between}
.sheet h3 .snum{font-family:var(--mono)}
.sheet-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.sq{aspect-ratio:1;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .12s;border:1.5px solid transparent}
.sq:hover{transform:scale(1.08)}
.sq.cur{border-color:var(--brand);color:var(--brand);background:var(--brand-l)}
.sq.answered{background:var(--brand);color:#fff}
.sq.answered.cur{outline:2px solid var(--brand);outline-offset:2px;background:var(--brand-d)}
.sq.flagged{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.sq.answered.flagged{background:linear-gradient(135deg,var(--brand) 55%,var(--warn) 55%)}
.sq.answered.flagged.cur{outline:2px solid var(--brand);outline-offset:2px}
.sheet-legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:12px;font-size:11.5px;color:var(--text3)}
.sheet-legend span{display:inline-flex;align-items:center;gap:5px}
.sheet-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.sheet .btn{margin-top:14px}
.legend-ans{background:var(--brand)}
.legend-cur{background:var(--brand-l);border:1.5px solid var(--brand)}
.legend-flag{background:var(--warn-bg);border:1px solid var(--warn)}
.exam-toolbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--bg2);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(18,36,72,.1)}
.exam-toolbar .et-in{display:flex;gap:8px;align-items:center;max-width:720px;margin:0 auto}
.et-timer{font-family:var(--mono);font-weight:700;font-size:18px;margin-right:2px}
.drawer-mask{position:fixed;inset:0;background:rgba(10,18,34,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--bg2);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.3,1);max-height:72vh;overflow:auto;box-shadow:var(--shadow-lg)}
.drawer.show{transform:none}
.drawer .grip{width:40px;height:4px;border-radius:3px;background:var(--line2);margin:0 auto 12px}

/* ============ 结果页 ============ */
.result-hero{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;text-align:center;box-shadow:var(--shadow)}
.score-ring{position:relative;width:148px;height:148px;margin:6px auto 12px}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .ring-bg{fill:none;stroke:var(--bg3);stroke-width:11}
.score-ring .ring-fg{fill:none;stroke:var(--brand);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.score-ring .ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring .ring-txt b{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1}
.score-ring .ring-txt span{font-size:12px;color:var(--text3);margin-top:3px}
.result-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.rc{background:var(--bg4);border:1px solid var(--line);border-radius:11px;padding:11px 8px;text-align:center}
.rc b{font-family:var(--mono);font-size:19px;display:block}
.rc span{font-size:12px;color:var(--text3)}
.rc.g b{color:var(--ok)} .rc.r b{color:var(--err)} .rc.y b{color:var(--warn)}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.analysis-item{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--bg2);box-shadow:var(--shadow)}
.analysis-item .ai-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.analysis-item .ai-tag{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.analysis-item .ai-ok{background:var(--ok-bg);color:var(--ok)}
.analysis-item .ai-no{background:var(--err-bg);color:var(--err)}
.analysis-item .ai-stem{font-weight:600;font-size:14.5px;margin-bottom:10px}
.analysis-item .opt{pointer-events:none;margin-bottom:7px;padding:8px 11px}
.analysis-item .ai-ans{font-size:13.5px;margin-top:10px;line-height:1.75}
.analysis-item .ai-ans b{color:var(--ok)}
.analysis-item .ai-ans .my{color:var(--err)}
.analysis-item .ai-exp{font-size:13.5px;color:var(--text2);background:var(--bg4);border-radius:9px;padding:10px 12px;margin-top:10px;line-height:1.75}
.analysis-item .ai-exp b{color:var(--text)}

/* ============ 题库浏览 ============ */
.bank-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.bank-tabs button{padding:9px 18px;border-radius:11px;font-weight:600;font-size:14px;background:var(--bg2);border:1px solid var(--line);color:var(--text2);box-shadow:var(--shadow)}
.bank-tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bank-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.bank-toolbar input[type=search]{flex:1;min-width:180px}
.bank-toolbar select{min-width:120px}
.q-item{border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:12px;background:var(--bg2);box-shadow:var(--shadow)}
.q-item .qi-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.q-item .qi-stem{font-size:14.5px;font-weight:600;line-height:1.65;cursor:pointer}
.q-item .qi-stem:hover{color:var(--brand)}
.q-item .qi-opt{font-size:13.5px;color:var(--text2);margin:6px 0 2px 2px;display:flex;gap:8px;align-items:baseline}
.q-item .qi-opt .k{font-family:var(--mono);font-weight:700;color:var(--text3);flex:none}
.q-item.exp .qi-body{display:block}
.q-item .qi-body{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:13.5px;line-height:1.8}
.q-item .qi-ans{color:var(--ok);font-weight:700}
.q-item .qi-exp{color:var(--text2);margin-top:6px;font-weight:600}
.q-item .qi-exp b{color:var(--text)}
.hl-ans{background:#ffe08a;color:#c81e1e;font-weight:800;padding:0 5px;border-radius:4px;margin:0 1px;box-shadow:0 0 0 1px #f59e0b}
.q-item.exp .qi-opt-ans{background:#ffe08a;color:#c81e1e;font-weight:800;border-radius:6px;padding:2px 6px}
.qi-actions{display:flex;gap:8px;margin-top:10px}
.qi-actions .mini{padding:5px 11px;font-size:12.5px;border-radius:8px}
.mini-fav.on{color:var(--warn);background:var(--warn-bg);border-color:var(--warn)}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px}
.pager button{min-width:76px}
.pager span{font-family:var(--mono);font-size:13px;color:var(--text3)}

/* ============ 错题本 ============ */
.wrong-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.wrong-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}

/* ============ 分析 ============ */
.stats-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
.chart-box{position:relative;width:100%;overflow:hidden}
.chart-box svg{width:100%;height:auto;display:block}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text3);margin-top:8px}
.chart-legend i{width:14px;height:3px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
.chart-title{font-size:13.5px;font-weight:600;margin-bottom:4px}
.point-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.point-row .pn{flex:none;width:118px;font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.point-row .pbar{flex:1;height:9px;background:var(--bg3);border-radius:5px;overflow:hidden}
.point-row .pbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 60%,var(--ok)))}
.point-row .pv{flex:none;width:42px;font-family:var(--mono);font-size:12.5px;font-weight:700;text-align:right}
.point-row .pvl{flex:none;width:52px;font-size:12px;color:var(--text3)}

/* ============ 管理 / 设置 ============ */
.drop-zone{border:2px dashed var(--line2);border-radius:var(--radius);padding:34px 18px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg4)}
.drop-zone:hover,.drop-zone.over{border-color:var(--brand);background:var(--brand-l)}
.drop-zone b{font-size:14.5px}
.drop-zone p{font-size:12.5px;color:var(--text3);margin-top:4px}
.code-block{background:#0d1524;color:#c9d6ea;border-radius:10px;padding:14px;font-family:var(--mono);font-size:12px;line-height:1.7;overflow:auto;max-height:300px;white-space:pre}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 2px;border-bottom:1px dashed var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .sr-t b{font-size:14.5px;display:block}
.set-row .sr-t span{font-size:12.5px;color:var(--text3)}
.switch{position:relative;width:46px;height:26px;flex:none;cursor:pointer}
.switch input{display:none}
.switch i{position:absolute;inset:0;background:var(--bg3);border:1px solid var(--line2);border-radius:999px;transition:background .2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+i{background:var(--brand);border-color:var(--brand)}
.switch input:checked+i::after{transform:translateX(20px)}

/* ============ 弹层 / 提示 ============ */
.modal-mask{position:fixed;inset:0;background:rgba(10,18,34,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;max-width:430px;width:100%;padding:22px;box-shadow:var(--shadow-lg);transform:scale(.96);transition:transform .2s}
.modal-mask.show .modal{transform:none}
.modal h3{font-size:17px;margin-bottom:8px}
.modal p{font-size:14px;color:var(--text2);margin-bottom:16px;line-height:1.7}
.modal .m-actions{display:flex;gap:10px;justify-content:flex-end}
.toast-wrap{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg2);padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(-8px);transition:all .25s;max-width:88vw}
[data-theme="dark"] .toast{background:var(--text);color:var(--bg)}
.toast.show{opacity:1;transform:none}
.toast.ok{background:var(--ok);color:#fff}
.toast.err{background:var(--err);color:#fff}

/* ============ 打印 ============ */
@media print{
  .topbar,.exam-toolbar,.drawer,.toast-wrap,.no-print,.sheet{display:none !important}
  body{background:#fff;color:#000}
  .page{display:block !important}
  .card,.analysis-item,.q-item{box-shadow:none;border-color:#ccc}
  .exam-layout{grid-template-columns:1fr}
}

/* ============ 响应式 ============ */
@media (max-width:1024px){
  .exam-layout{grid-template-columns:1fr}
  .sheet{position:fixed;display:none}
}
@media (max-width:768px){
  .hero{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr}
  .result-cards,.wrong-stat{grid-template-columns:repeat(2,1fr)}
  .nav button span.nav-txt{display:none}
  .nav button{padding:7px 10px}
  .brand small{display:none}
  .dash-grid{grid-template-columns:1fr}
  .topbar-in{gap:8px}
}
@media (max-width:480px){
  .q-card{padding:16px 14px 12px}
  .q-foot{flex-direction:column;align-items:stretch}
  .q-foot .btns{justify-content:space-between}
  .hero-main h1{font-size:20px}
  .cfg-grid{grid-template-columns:1fr}
  .sheet-grid{grid-template-columns:repeat(6,1fr)}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}

const BANK_MAP = {}; BANK.forEach(q => BANK_MAP[q.id] = q);

const POINTS = ["计算机硬件","操作系统","数据通信基础","网络体系结构","IP地址与子网","局域网与交换","广域网与接入","网络层与路由","传输层","应用层协议","网络安全","无线网络","网络管理与监控","网络规划与布线","系统开发与项目管理","存储与新技术","法律法规与知识产权"];

const semTxt = s => s === "下" ? "下半年" : "上半年";

const yearSemLabel = q => q.year + semTxt(q.sem);

/* ---------- 本地存储 ---------- */
const Store = {
  get(k, d) { try { const v = localStorage.getItem("netexam." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("netexam." + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { localStorage.removeItem("netexam." + k); }
};
const DB = {
  records: Store.get("records", []),       // 考试记录（含每题明细）
  wrong: Store.get("wrong", []),           // 错题 [{qid,cnt,last}]
  fav: Store.get("fav", []),               // 收藏 qid[]
  settings: Object.assign({ theme: "light", examMinutes: 0, wrongCapture: true, shuffleOptions: false, shuffleQuestions: true }, Store.get("settings", {})),
  imported: Store.get("imported", []),     // 导入的题目（保留以便导出）
  save() { Store.set("records", this.records); Store.set("wrong", this.wrong); Store.set("fav", this.fav); Store.set("settings", this.settings); Store.set("imported", this.imported); }
};
const isFav = qid => DB.fav.includes(qid);
const wrongMap = () => { const m = {}; DB.wrong.forEach(w => m[w.qid] = w); return m; };
const EXTRA = Store.get("extra", []);
EXTRA.forEach(q => BANK_MAP[q.id] = q);

/* ---------- UI：toast / modal / drawer ---------- */
function toast(msg, type) {
  const t = document.createElement("div");
  t.className = "toast" + (type ? " " + type : "");
  t.textContent = msg;
  $("#toasts").appendChild(t);
  requestAnimationFrame(() => t.classList.add("show"));
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 2200);
}
function modal(title, body, actions) {
  $("#modal").innerHTML = "<h3>" + esc(title) + "</h3>" + body + '<div class="m-actions">' + actions + "</div>";
  $("#modalMask").classList.add("show");
  $$("#modal [data-close]").forEach(b => b.onclick = closeModal);
}
function closeModal() { $("#modalMask").classList.remove("show"); }
function openDrawer(html) { $("#drawerBody").innerHTML = html; $("#drawer").classList.add("show"); $("#drawerMask").classList.add("show"); }
function closeDrawer() { $("#drawer").classList.remove("show"); $("#drawerMask").classList.remove("show"); }

}

  window.scrollTo(0, 0);
}
function renderNav() {
  $("#nav").innerHTML = NAV.map(([r, t, ic]) =>
    '<button data-go="' + r + '" class="' + (currentRoute === r ? "on" : "") + '">' + ic + '<span class="nav-txt">' + t + "</span></button>").join("");
  $$("#nav button").forEach(b => b.onclick = () => go(b.dataset.go));

}

        "</div>" +
        '<div class="hero-meta">' +
          '<div class="hm"><b>' + totalQ + "</b><span>收录题目</span></div>" +

          '<div class="hm"><b>' + mockN + "</b><span>模拟题</span></div>" +

        "</div>" +
      "</div>" +
      '<div class="kpi-grid">' +
        kpi("平均分", avg == null ? "—" : avg + "%", "近 7 天" + (weekAvg == null ? "" : " " + weekAvg + "%"), avg != null ? (avg >= 60 ? "var(--ok)" : "var(--err)") : "var(--text)") +
        kpi("已练题目", doneN, "共 " + totalQ + " 题", "var(--brand)") +

function kpi(label, num, sub, color) {
  return '<div class="kpi"><div class="k-label">' + label + "</div><div class=\"k-num\" style=\"color:" + color + '">' + num + '</div><div class="k-sub">' + sub + "</div></div>";
}

/* ---------- 组卷配置 ---------- */
const AVAIL_SEMS = (() => {
  const set = new Set(allBank().filter(q => q.source === "real").map(q => yearSemKey(q.year, q.sem)));
  return [...set].sort((a, b) => {
    const ya = parseInt(a), yb = parseInt(b);
    if (ya !== yb) return yb - ya;
    return (a.endsWith("下") ? 1 : 0) - (b.endsWith("下") ? 1 : 0);
  }).map(k => ({ key: k, year: parseInt(k), sem: k.endsWith("下") ? "下" : "上", label: parseInt(k) + (k.endsWith("下") ? "下半年" : "上半年") }));
})();
const Cfg = { source: "real", years: [], points: [], count: 20, minutes: 0, shuffle: DB.settings.shuffleQuestions !== false };
function countCfg() {
  let list = allBank();
  if (Cfg.source === "real") list = list.filter(q => q.source === "real");
  else if (Cfg.source === "mock") list = list.filter(q => q.source === "mock");
  if (Cfg.source === "real" && Cfg.years.length) list = list.filter(q => Cfg.years.includes(yearSemKey(q.year, q.sem)));
  if (Cfg.points.length) list = list.filter(q => Cfg.points.includes(q.point));
  return list;
}
function renderExamCfg() {
  const list = countCfg();
  const yearChips = AVAIL_SEMS.map(ys => '<button class="chip' + (Cfg.years.includes(ys.key) ? " on" : "") + '" data-year="' + ys.key + '">' + ys.label + "（" + allBank().filter(q => q.source === "real" && yearSemKey(q.year, q.sem) === ys.key).length + "题）</button>").join("");
  const pointChips = POINTS.map(p => {
    const n = allBank().filter(q => q.point === p).length;
    return '<button class="chip' + (Cfg.points.includes(p) ? " on" : "") + '" data-point="' + esc(p) + '">' + p + " (" + n + ")</button>";
  }).join("");
  const autoMin = Math.ceil(Cfg.count * 2);

  $("#view-exam-cfg").innerHTML =
    '<h1 class="page-title" style="margin-bottom:16px">模拟考试 · 组卷</h1>' +
    '<div class="card card-pad" style="margin-bottom:14px">' +
      '<div class="field" style="margin-bottom:14px"><label>题库来源</label>' +
        '<div class="seg">' +
          '<button class="' + (Cfg.source === "real" ? "on" : "") + '" data-src="real">历年真题</button>' +
          '<button class="' + (Cfg.source === "mock" ? "on" : "") + '" data-src="mock">模拟题</button>' +
          '<button class="' + (Cfg.source === "mix" ? "on" : "") + '" data-src="mix">混合</button>' +
        "</div>" +
        '<div class="hint">真题：收录历年真实考题（含解析）；模拟：高仿真考点模拟题，难度对齐真题。</div>' +
      "</div>" +
      (Cfg.source === "real" || Cfg.source === "mix" ?
        '<div class="field" style="margin-bottom:14px"><label>年份 / 场次（不选 = 全部）</label><div class="chips" id="yearChips">' + yearChips + "</div></div>" : "") +
      (Cfg.source !== "real" ?
        '<div class="field" style="margin-bottom:14px"><label>知识点（不选 = 全部考点）</label><div class="chips" id="pointChips">' + pointChips + "</div></div>" : "") +
      '<div class="cfg-grid">' +
        '<div class="field"><label>题目数量</label><div class="range-wrap"><input type="range" id="cfgCount" min="5" max="75" step="5" value="' + Cfg.count + '"><output id="cfgCountOut">' + Cfg.count + " 题</output></div></div>" +
        '<div class="field"><label>考试时长</label><div class="range-wrap"><input type="range" id="cfgMin" min="0" max="150" step="5" value="' + Cfg.minutes + '"><output id="cfgMinOut">' + (Cfg.minutes ? Cfg.minutes + " 分钟" : "自动(" + autoMin + " 分钟)") + "</output></div>" +
        '<div class="hint">不设时长则按每题 2 分钟自动分配（接近真实考试节奏）。</div></div>' +
      "</div>" +
    "</div>" +
    '<div class="cfg-summary">' +
      '<div><span class="cs-tip">当前题库匹配：</span><span class="cs-num">' + list.length + "</span> <span class=\"cs-tip\">题</span></div>" +
      '<button class="btn btn-ghost" id="cfgShuffle">' + (Cfg.shuffle ? "打乱顺序：开" : "打乱顺序：关") + "</button>" +
      '<button class="btn btn-pri btn-lg" id="cfgStart"' + (list.length ? "" : " disabled") + ">" + I.exam + " 开始考试</button>" +
    "</div>";

  const bind = () => {
    $$("#view-exam-cfg [data-src]").forEach(b => b.onclick = () => { Cfg.source = b.dataset.src; Cfg.years = []; Cfg.points = []; renderExamCfg(); });
    $$("#yearChips .chip").forEach(b => b.onclick = () => {
      const k = b.dataset.year;
      Cfg.years.includes(k) ? Cfg.years = Cfg.years.filter(x => x !== k) : Cfg.years.push(k);
      renderExamCfg();
    });
    $$("#pointChips .chip").forEach(b => b.onclick = () => {
      const p = b.dataset.point;
      Cfg.points.includes(p) ? Cfg.points = Cfg.points.filter(x => x !== p) : Cfg.points.push(p);
      renderExamCfg();
    });
    const cnt = $("#cfgCount"), cntOut = $("#cfgCountOut"), mn = $("#cfgMin"), mnOut = $("#cfgMinOut");
    cnt.oninput = () => { Cfg.count = +cnt.value; cntOut.textContent = Cfg.count + " 题"; mnOut.textContent = mn.value ? mn.value + " 分钟" : "自动(" + Math.ceil(Cfg.count * 2) + " 分钟)"; };
    mn.oninput = () => { Cfg.minutes = +mn.value; mnOut.textContent = mn.value ? mn.value + " 分钟" : "自动(" + Math.ceil(Cfg.count * 2) + " 分钟)"; };
    $("#cfgShuffle").onclick = () => { Cfg.shuffle = !Cfg.shuffle; renderExamCfg(); };
    $("#cfgStart").onclick = () => {
      const src = countCfg();
      if (!src.length) return toast("当前筛选下没有可用题目", "err");
      const n = Math.min(Cfg.count, src.length);
      let qs = Cfg.shuffle ? pick(src, n) : src.slice(0, n);
      const minutes = Cfg.minutes || Math.ceil(n * 2);
      Exam.start(qs.map(q => q.id), minutes, srcName(), { real: Cfg.source !== "mock", mock: Cfg.source !== "real" });
    };
  };
  bind();
}
function srcName() {
  if (Cfg.source === "real") return "真题模考";
  if (Cfg.source === "mock") return "模拟题模考";
  return "混合模考";
}

/* ---------- 考试引擎 ---------- */
const Exam = {
  active: false, qs: [], answers: {}, flags: {}, cur: 0, seconds: 0, minutes: 0,
  title: "", timerId: null, startTs: 0, sourceFlags: {},
  start(qids, minutes, title, sf) {
    this.active = true; this.qs = qids; this.answers = {}; this.flags = {};
    this.cur = 0; this.minutes = minutes; this.seconds = minutes * 60;
    this.title = title; this.sourceFlags = sf; this.startTs = Date.now();
    this.timerId = setInterval(() => this.tick(), 1000);
    go("exam");
  },
  q() { return BANK_MAP[this.qs[this.cur]]; },
  answeredCount() { return this.qs.filter(id => this.answers[id]).length; },
  flaggedCount() { return this.qs.filter(id => this.flags[id]).length; },
  tick() {
    this.seconds--;
    const el = $("#examTimer"); if (el) { el.textContent = fmtClock(this.seconds); el.classList.toggle("warn", this.seconds <= 300); }
    const et = $("#etTimer"); if (et) et.textContent = fmtClock(this.seconds);
    const p = $("#examProgressBar"); if (p) p.style.width = (this.answeredCount() / this.qs.length * 100) + "%";
    const ep = $("#etProgress"); if (ep) ep.textContent = this.answeredCount() + "/" + this.qs.length;
    if (this.seconds <= 0) { clearInterval(this.timerId); toast("考试时间到，系统已自动交卷", "ok"); this.submit(true); }
  },
  select(key) {
    if (!this.active) return;
    const q = this.q();
    if (this.answers[q.id] === key) { delete this.answers[q.id]; } else { this.answers[q.id] = key; }
    this.renderCurrent();
  },
  toggleFlag() {
    const q = this.q();
    this.flags[q.id] ? delete this.flags[q.id] : this.flags[q.id] = true;
    this.renderCurrent();
  },
  goto(i) { if (i >= 0 && i < this.qs.length) { this.cur = i; this.renderCurrent(); } },
  submit(force) {
    if (!this.active) return;
    const n = this.qs.length, answered = this.answeredCount();
    if (!force && answered < n) {
      modal("确认交卷", "<p>还有 <b style=\"color:var(--warn)\">" + (n - answered) + "</b> 题未作答，确认现在交卷吗？</p>",
        '<button class="btn btn-ghost" data-close>继续答题</button><button class="btn btn-pri" id="modalSubmit">确认交卷</button>');
      $("#modalSubmit").onclick = () => { closeModal(); this.finish(); };
      $$("#modal [data-close]").forEach(b => b.onclick = closeModal);
      return;
    }
    this.finish();
  },
  finish() {
    clearInterval(this.timerId);
    const used = Math.round((Date.now() - this.startTs) / 1000);
    const detail = this.qs.map(id => {
      const q = BANK_MAP[id];
      return { qid: id, ok: this.answers[id] === q.answer };
    });
    const score = detail.filter(d => d.ok).length;
    const rec = {
      id: uid(), ts: Date.now(), title: this.title, total: this.qs.length, score, used,
      rate: Math.round(score / this.qs.length * 100),
      detail, source: this.sourceFlags, answersOf: Object.assign({}, this.answers)
    };
    DB.records.push(rec);
    if (DB.settings.wrongCapture) {
      const wm = wrongMap();
      detail.filter(d => !d.ok).forEach(d => {
        if (wm[d.qid]) { wm[d.qid].cnt++; wm[d.qid].last = Date.now(); }
        else DB.wrong.push({ qid: d.qid, cnt: 1, last: Date.now() });
      });
    }
    DB.save();
    this.active = false; this.qs = [];
    Result.last = rec;
    go("result");
  },
  renderCurrent() { renderExam(); }
};

document.addEventListener("keydown", e => {

  const tag = (document.activeElement || {}).tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const k = e.key.toUpperCase();
  if (["A", "B", "C", "D"].includes(k)) { e.preventDefault(); Exam.select(k); }

});

      '<div class="rc y"><b>' + totalWrong + "</b><span>错题总数</span></div>" +
      '<div class="rc"><b>' + [...new Set(DB.wrong.map(w => BANK_MAP[w.qid] ? BANK_MAP[w.qid].point : ""))].filter(Boolean).length + "</b><span>涉及知识点</span></div>" +
      '<div class="rc"><b>' + DB.wrong.reduce((s, w) => s + w.cnt, 0) + "</b><span>累计答错</span></div>" +
      '<div class="rc r"><b>' + retryN + "</b><span>需重点重练（≥2次）</span></div>" +
    "</div>" +
    '<div class="wrong-actions">' +
      (totalWrong ? '<button class="btn btn-pri" id="wrongRetry">' + I.exam + " 错题重练（" + Math.min(totalWrong, 75) + " 题）</button>" : "") +
      (totalWrong ? '<button class="btn btn-ghost" id="wrongClear">' + I.trash + " 清空错题本</button>" : "") +
      '<a class="btn btn-ghost" href="#/bank">去题库复习</a>' +
    "</div>" +
    (items || '<div class="empty"><p>暂无错题，继续保持</p></div>');
  const retry = $("#wrongRetry");
  if (retry) retry.onclick = () => {
    const ids = DB.wrong.map(w => w.qid);
    const n = Math.min(ids.length, 75);
    Exam.start(pick(ids, n), Math.ceil(n * 2), "错题重练", { real: true, mock: true });
  };
  const clr = $("#wrongClear");
  if (clr) clr.onclick = () => modal("清空错题本", "<p>将删除全部 " + totalWrong + " 条错题记录，此操作不可撤销。</p>",
    '<button class="btn btn-ghost" data-close>取消</button><button class="btn btn-danger" id="wrongClearOk">确认清空</button>');
  $("#wrongClearOk") && ($("#wrongClearOk").onclick = () => { DB.wrong = []; DB.save(); closeModal(); renderWrong(); toast("错题本已清空", "ok"); });
  $$("#view-wrong [data-close]").forEach(b => b.onclick = closeModal);
  $$("#view-wrong [data-wshow]").forEach(b => b.onclick = () => {
    const item = b.closest(".q-item"); const body = item.querySelector(".qi-body");
    const show = body.style.display !== "block";
    body.style.display = show ? "block" : "none"; item.classList.toggle("exp", show); b.textContent = show ? "收起解析" : "查看解析";
  });
  $$("#view-wrong [data-wdel]").forEach(b => b.onclick = () => {
    DB.wrong = DB.wrong.filter(w => w.qid !== b.dataset.wdel); DB.save(); renderWrong(); toast("已移除", "ok");
  });
}

/* ---------- 学习分析 ---------- */
function renderStats() {
  const recs = DB.records;
  const detail = recs.flatMap(r => (r.detail || []).map(d => ({ qid: d.qid, ok: d.ok })));
  const byPoint = {};
  detail.forEach(d => { const q = BANK_MAP[d.qid]; if (!q) return; const p = q.point || "综合"; byPoint[p] = byPoint[p] || { n: 0, ok: 0 }; byPoint[p].n++; if (d.ok) byPoint[p].ok++; });
  const pointRows = Object.entries(byPoint).sort((a, b) => (b[1].ok / b[1].n) - (a[1].ok / a[1].n));
  const total = detail.length, okN = detail.filter(d => d.ok).length;
  const overall = total ? Math.round(okN / total * 100) : null;
  const lineSvg = lineChart(recs);

  $("#view-stats").innerHTML =
    '<h1 class="page-title" style="margin-bottom:16px">学习分析</h1>' +
    '<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">' +
      kpi("累计答题", total, "基于全部模考记录", "var(--brand)") +
      kpi("综合正确率", overall == null ? "—" : overall + "%", overall != null ? (overall >= 60 ? "稳中有进" : "需要加把劲") : "暂无数据", overall != null ? (overall >= 60 ? "var(--ok)" : "var(--err)") : "var(--text3)") +
      kpi("模考次数", recs.length, recs.length ? "最近 " + fmtDate(recs[recs.length - 1].ts) : "—", "var(--text)") +
      kpi("薄弱知识点", Object.keys(byPoint).length ? Object.keys(byPoint).length : "—", "建议优先复习", "var(--warn)") +
    "</div>" +
    '<div class="stats-grid">' +
      '<div class="card card-pad"><h2 class="sec-title">模考正确率趋势</h2>' + lineSvg + "</div>" +
      '<div class="card card-pad"><h2 class="sec-title">知识点掌握度</h2>' + pointBars(pointRows) + "</div>" +
    "</div>";
}
function pointBars(rows) {
  if (!rows.length) return '<div class="empty"><p>完成模考后这里会展示各知识点掌握度</p></div>';
  return rows.map(([p, v]) => {
    const pct = Math.round(v.ok / v.n * 100);
    const color = pct >= 80 ? "var(--ok)" : pct >= 60 ? "var(--warn)" : "var(--err)";
    return '<div class="point-row"><span class="pn">' + esc(p) + '</span><span class="pbar"><i style="width:' + pct + "%;background:" + color + '"></i></span><span class="pv" style="color:' + color + '">' + pct + '%</span><span class="pvl">' + v.ok + "/" + v.n + "</span></div>";
  }).join("");
}
function lineChart(recs) {
  if (recs.length < 2) return '<div class="empty"><p>完成至少 2 次模考后生成趋势图</p></div>';
  const W = 620, H = 230, L = 46, R = 16, T = 14, B = 34;
  const iw = W - L - R, ih = H - T - B;
  const data = recs.map((r, i) => ({ x: L + iw * (recs.length === 1 ? 0.5 : i / (recs.length - 1)), y: T + ih * (1 - r.rate / 100), r: r.rate, ts: r.ts, title: r.title }));
  const gx = (v) => (L + iw * v);
  let grid = "";
  for (let g = 0; g <= 4; g++) { const v = g * 25; const y = T + ih * (1 - v / 100); grid += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="var(--line)" stroke-dasharray="3 4"/><text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10.5" fill="var(--text3)">' + v + '</text>'; }
  const xLabels = [0, recs.length > 1 ? Math.floor((recs.length - 1) / 2) : 0, recs.length - 1];
  let xl = xLabels.filter((v, i, a) => a.indexOf(v) === i).map(i => '<text x="' + data[i].x + '" y="' + (H - B + 18) + '" text-anchor="middle" font-size="10.5" fill="var(--text3)">' + fmtDate(data[i].ts).slice(5) + "</text>").join("");
  const path = data.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");
  const area = path + " L" + (W - R) + " " + (T + ih) + " L" + L + " " + (T + ih) + " Z";
  const dots = data.map(p => '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4" fill="var(--bg2)" stroke="var(--brand)" stroke-width="2"><title>' + esc(p.title) + " " + p.r + "%</title></circle>").join("");
  return '<div class="chart-box"><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="模考正确率趋势">' +
    grid + xl +
    '<path d="' + area + '" fill="var(--brand)" opacity=".08"/>' +
    '<path d="' + path + '" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' + dots +
    "</svg><div class=\"chart-legend\"><span><i style=\"background:var(--brand)\"></i>正确率（%）</span><span>共 " + recs.length + " 次模考</span></div></div>";
}

/* ---------- 题库管理 ---------- */
function renderManage() {
  const importedN = EXTRA.length;
  const sample = '[\n  { "id": "custom-01", "source": "mock", "year": 2025, "point": "网络层与路由", "diff": 3,\n    "stem": "题干内容", "options": ["选项A", "选项B", "选项C", "选项D"], "answer": "A", "analysis": "解析" }\n]';
  $("#view-manage").innerHTML =
    '<h1 class="page-title" style="margin-bottom:16px">题库管理</h1>' +
    '<div class="stats-grid">' +
      '<div class="card card-pad">' +
        '<h2 class="sec-title">导入题库' + '<span class="sec-sub">（JSON 文件）</span></h2>' +
        '<div class="drop-zone" id="dropZone">' +
          '<div style="font-size:30px;margin-bottom:6px;color:var(--brand)">' + I.upload + "</div>" +
          "<b>点击选择或拖拽 JSON 文件到此处</b><p>支持导入题目数组，可扩充任意数量真题 / 模拟题</p>" +
        "</div>" +
        '<input type="file" id="fileInput" accept=".json,application/json" style="display:none">' +
        '<div style="margin-top:14px"><h2 class="sec-title" style="font-size:14px">字段说明</h2>' +
        '<div class="code-block">' + esc(sample) + "</div></div>" +
      "</div>" +
      '<div class="card card-pad">' +
        '<h2 class="sec-title">导出</h2>' +
        '<div style="display:flex;flex-direction:column;gap:10px">' +
          '<button class="btn btn-ghost btn-block" id="expQ">' + I.download + " 导出全部题库（" + allBank().length + " 题）</button>" +
          '<button class="btn btn-ghost btn-block" id="expData">' + I.download + " 导出学习数据（记录/错题/收藏）</button>" +
        "</div>" +
        '<div style="margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)">' +
          '<h2 class="sec-title" style="font-size:14px">数据概况</h2>' +
          '<div class="list-row"><div class="lr-main"><div class="lr-title">内置真题</div></div><span class="pill-score">' + allBank().filter(q => q.source === "real").length + " 题</span></div>" +
          '<div class="list-row"><div class="lr-main"><div class="lr-title">内置模拟题</div></div><span class="pill-score">' + allBank().filter(q => q.source === "mock").length + " 题</span></div>" +
          '<div class="list-row"><div class="lr-main"><div class="lr-title">已导入题目</div></div><span class="pill-score">' + importedN + " 题</span></div>" +
          '<div class="list-row"><div class="lr-main"><div class="lr-title">考试记录 / 错题 / 收藏</div></div><span class="pill-score">' + DB.records.length + " / " + DB.wrong.length + " / " + DB.fav.length + "</span></div>" +
        "</div>" +
      "</div>" +
    "</div>";
  const dz = $("#dropZone"), fi = $("#fileInput");
  dz.onclick = () => fi.click();
  dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
  dz.ondragleave = () => dz.classList.remove("over");
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over"); if (e.dataTransfer.files[0]) readImport(e.dataTransfer.files[0]); };
  fi.onchange = () => { if (fi.files[0]) readImport(fi.files[0]); fi.value = ""; };
  $("#expQ").onclick = () => downloadJSON("network-questions.json", allBank());
  $("#expData").onclick = () => downloadJSON("netexam-backup.json", { records: DB.records, wrong: DB.wrong, fav: DB.fav, settings: DB.settings, extra: EXTRA });
}
function readImport(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const raw = JSON.parse(rd.result);
      const arr = Array.isArray(raw) ? raw : (Array.isArray(raw.questions) ? raw.questions : null);
      if (!arr) return toast("文件格式不正确：应为题目数组或 {questions:[...]}", "err");
      let ok = 0, skip = 0, bad = 0;
      arr.forEach(it => {
        if (!it || !it.id || !it.stem || !Array.isArray(it.options) || it.options.length < 2 || !it.answer) { bad++; return; }
        if (BANK_MAP[it.id] || EXTRA.some(x => x.id === it.id)) { skip++; return; }
        const q = Object.assign({ source: "mock", year: 0, point: "综合", diff: 3, analysis: "" }, it);
        q.source = q.source === "real" ? "real" : "mock";
        q.answer = String(q.answer).toUpperCase().replace(/[^A-D]/g, "");
        if (!q.answer || q.answer.length > 1) { bad++; return; }
        EXTRA.push(q); ok++;
      });
      DB.extra = EXTRA; Store.set("extra", EXTRA);
      EXTRA.forEach(q => { BANK_MAP[q.id] = q; });
      DB.save();
      toast("导入完成：成功 " + ok + " 题" + (skip ? "，跳过重复 " + skip : "") + (bad ? "，格式错误 " + bad : ""), ok ? "ok" : "err");
      renderManage();
    } catch (e) { toast("解析失败：" + e.message, "err"); }
  };
  rd.onerror = () => toast("文件读取失败", "err");
  rd.readAsText(file, "utf-8");
}
function downloadJSON(name, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- 设置 ---------- */
function renderSettings() {
  const s = DB.settings;
  $("#view-settings").innerHTML =
    '<h1 class="page-title" style="margin-bottom:16px">设置</h1>' +
    '<div class="card card-pad" style="max-width:640px">' +
      '<div class="set-row"><div class="sr-t"><b>深色模式</b><span>降低夜间刷题亮度</span></div>' +
        '<label class="switch"><input type="checkbox" id="setTheme"' + (s.theme === "dark" ? " checked" : "") + '><i></i></label></div>' +
      '<div class="set-row"><div class="sr-t"><b>考试默认时长</b><span>0 表示按每题 2 分钟自动分配</span></div>' +
        '<input type="number" id="setMin" min="0" max="180" step="5" value="' + s.examMinutes + '" style="width:86px;text-align:center"></div>' +
      '<div class="set-row"><div class="sr-t"><b>错题自动收录</b><span>模考答错的题自动进入错题本</span></div>' +
        '<label class="switch"><input type="checkbox" id="setWrong"' + (s.wrongCapture ? " checked" : "") + '><i></i></label></div>' +
      '<div class="set-row"><div class="sr-t"><b>组卷打乱题目</b><span>模考时随机打乱题目顺序</span></div>' +
        '<label class="switch"><input type="checkbox" id="setShuffleQ"' + (s.shuffleQuestions ? " checked" : "") + '><i></i></label></div>' +
      '<div class="set-row" style="border-bottom:none"><div class="sr-t"><b>重置所有数据</b><span>清除考试记录、错题、收藏与导入题目</span></div>' +
        '<button class="btn btn-danger" id="setReset">重置</button></div>' +
    "</div>";
  $("#setTheme").onchange = e => applyTheme(e.target.checked ? "dark" : "light");
  $("#setMin").onchange = e => { s.examMinutes = Math.max(0, +e.target.value || 0); DB.save(); toast("已保存"); };
  $("#setWrong").onchange = e => { s.wrongCapture = e.target.checked; DB.save(); };
  $("#setShuffleQ").onchange = e => { s.shuffleQuestions = e.target.checked; DB.save(); };
  $("#setReset").onclick = () => {
    modal("重置所有数据", "<p>将清除全部考试记录、错题、收藏、已导入题目与个性化设置，内置题库不受影响。此操作不可撤销。</p>",
      '<button class="btn btn-ghost" data-close>取消</button><button class="btn btn-danger" id="resetOk">确认重置</button>');
    $("#resetOk").onclick = () => {
      localStorage.removeItem("netexam.records"); localStorage.removeItem("netexam.wrong"); localStorage.removeItem("netexam.fav"); localStorage.removeItem("netexam.settings"); localStorage.removeItem("netexam.extra"); localStorage.removeItem("netexam.imported");
      location.reload();
    };
    $$("#view-settings [data-close]").forEach(b => b.onclick = closeModal);
  };
}
